version: '3.8'

services:

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: nyaya-gati-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nyaya_gati
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nyaya_gati"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nyaya-gati-network

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7
    container_name: nyaya-gati-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nyaya-gati-network

  # ─── Elasticsearch ───────────────────────────────────────────────────────────
  # elasticsearch:
  #   image: elasticsearch:8.10.0
  #   container_name: nyaya-gati-elasticsearch
  #   restart: unless-stopped
  #   environment:
  #     - discovery.type=single-node
  #     - xpack.security.enabled=false
  #     - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
  #     - cluster.name=nyaya-gati-cluster
  #   ports:
  #     - "9200:9200"
  #     - "9300:9300"
  #   volumes:
  #     - elasticsearch_data:/usr/share/elasticsearch/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 40s
  #   networks:
  #     - nyaya-gati-network

  # ─── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: nyaya-gati-backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level info
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/nyaya_gati
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      ELASTICSEARCH_URL: http://elasticsearch:9200
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://localhost"]'
      ENVIRONMENT: development
    volumes:
      - ./backend:/app
      - ./models:/app/models
      - backend_cache:/root/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nyaya-gati-network

  # ─── Celery Worker ────────────────────────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: nyaya-gati-celery
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2 -Q ml_tasks,notifications,default
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/nyaya_gati
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      ELASTICSEARCH_URL: http://elasticsearch:9200
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
    volumes:
      - ./backend:/app
      - ./models:/app/models
    depends_on:
      - postgres
      - redis
    networks:
      - nyaya-gati-network

  # ─── Celery Beat (Cron Scheduler) ─────────────────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: nyaya-gati-celery-beat
    restart: unless-stopped
    command: celery -A app.core.celery_app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/nyaya_gati
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    networks:
      - nyaya-gati-network

  # ─── React Frontend (Dev mode) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: nyaya-gati-frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_WS_URL: ws://localhost:8000/ws
    volumes:
      - ./frontend:/app
      - /app/node_modules      # Prevents host node_modules from overwriting container's
    depends_on:
      - backend
    networks:
      - nyaya-gati-network

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  backend_cache:

networks:
  nyaya-gati-network:
    driver: bridge
